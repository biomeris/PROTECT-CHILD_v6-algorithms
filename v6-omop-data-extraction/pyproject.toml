[project]
name = "v6-omop-data-extraction"
version = "1.0.0"
description = "Data extraction algorithm from an OMOP database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vantage6-algorithm-tools>=5.0.0a43",
  "pandas",
  "rpy2==3.6.6",
  "rpy2-rinterface==3.6.5",
  "rpy2-robjects==3.6.4",
  "numpy>=2.0",
  "ohdsi-common",
  "ohdsi-database-connector",
  "ohdsi-sqlrender"
]

license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[tool.setuptools]
packages = ["v6-omop-data-extraction"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "sql/*.sql.j2"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"