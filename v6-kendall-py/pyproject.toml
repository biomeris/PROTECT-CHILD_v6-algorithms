[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-kendall-py"
version = "1.0.0"
description = "A Vantage6 algorithm implementing federated Kendall correlation without sharing raw data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vantage6-algorithm-tools>=5.0.0a43",
  "pandas",
  "numpy",
]
authors = [{ name = "Andrea Ceschini" }]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning", "kendall"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/AndrewCesc/PROTECT-CHILD_v6-algorithms"

[tool.hatch.build.targets.wheel]
packages = ["v6-kendall-py"]

[dependency-groups]
dev = [
  "pytest",
  "scipy",
]
