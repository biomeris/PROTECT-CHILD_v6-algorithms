[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-dunn-py"
version = "1.0.0"
description = "Federated Dunn's post-hoc test (pairwise mean-rank comparisons after Kruskal-Wallis) on binned global ranks, without any node sharing individual values"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vantage6-algorithm-tools>=5.0.0,!=5.1.0",  # 5.1.0 (and 5.0.4rc1) are missing their python-keycloak dependency
  "pandas",
  "numpy",
  "scipy",
]
authors = [
    { name = "Claire Ai" },
]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning", "dunn", "post-hoc", "kruskal-wallis", "non-parametric"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/biomeris/PROTECT-CHILD_v6-algorithms/tree/main/v6-dunn-py"

[tool.hatch.build.targets.wheel]
packages = ["v6-dunn-py"]


[dependency-groups]
dev = [
  "pytest",
  "scikit-posthocs",
  "statsmodels",
]
