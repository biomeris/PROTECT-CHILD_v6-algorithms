[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-pca-py"
version = "2.0.0"
description = "Exact covariance-based federated PCA for Vantage6 v5"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["vantage6-algorithm-tools>=5.0.0", "numpy", "pandas"]

[tool.hatch.build.targets.wheel]
packages = ["v6-pca-py"]

[dependency-groups]
dev = ["pytest"]
