[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-manova-py"
version = "1.0.0"
description = "Federated one-way MANOVA (Wilks, Pillai, Hotelling-Lawley, Roy) computed exactly from per-group sums and cross-product matrices"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vantage6-algorithm-tools>=5.0.0,!=5.1.0",  # 5.1.0 (and 5.0.4rc1) are missing their python-keycloak dependency
  "pandas",
  "numpy",
  "scipy",
]
authors = [
    { name = "Claire Ai" },
]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning", "manova", "multivariate-analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/biomeris/PROTECT-CHILD_v6-algorithms/tree/main/v6-manova-py"

[tool.hatch.build.targets.wheel]
packages = ["v6-manova-py"]


[dependency-groups]
dev = [
  "pytest",
  "statsmodels",
]
