[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-bonferroni-py"
version = "1.0.0"
description = "Bonferroni correction for multiple hypothesis testing, applied centrally to a family of p-values produced by another federated test"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vantage6-algorithm-tools>=5.0.0a43"
]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning", "bonferroni", "multiple-testing-correction"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/biomeris/PROTECT-CHILD_v6-algorithms/tree/main/v6-bonferroni-py"
Issues = "https://github.com/biomeris/PROTECT-CHILD_v6-algorithms/issues"

[tool.hatch.build.targets.wheel]
packages = ["v6-bonferroni-py"]

[tool.uv]
prerelease = "allow"
