[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-test-omop"
version = "1.0.0"
description = "test connection and data extraction from omop db"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vantage6-algorithm-tools>=5.0.0a43",
  "pandas",
  "rpy2==3.6.6",
  "rpy2-rinterface==3.6.5",
  "rpy2-robjects==3.6.4",
  "numpy>=2.0",
  "ohdsi-common",
  "ohdsi-database-connector",
  "ohdsi-sqlrender"
]
authors = [
    # TODO add authors
]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
# TODO add urls

[tool.hatch.build.targets.wheel]
packages = ["v6-test-omop"]

[dependency-groups]
dev = [
  "pytest",
]