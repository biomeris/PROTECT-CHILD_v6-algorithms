[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-t-test-py"
version = "2.0.0"
description = "Federated pooled two-sample Student t-test for Vantage6 v5"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["vantage6-algorithm-tools>=5.0.0", "numpy", "pandas", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["v6-t-test-py"]

[dependency-groups]
dev = ["pytest"]
